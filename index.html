<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>

  <!-- Instant redirect -->
  <meta http-equiv="refresh" content="0; url=/linker/">

  <!-- Canonical URL -->
  <link rel="canonical" href="/linker/">

  <script>
    window.location.replace("/linker/");
  </script>
</head>
<body>
  <p>If you are not redirected automatically,
    <a href="/linker/">click here</a>.
  </p>
</body>
</html>
